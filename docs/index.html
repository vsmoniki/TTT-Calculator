<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zwift TTT Calculator</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Chart.js for route profile visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <main id="auth-gate" class="auth-gate" role="main" hidden>
    <form id="auth-form" class="auth-form" aria-label="ログインフォーム">
      <h1 class="site-title">⚡ TTT Calculator</h1>
      <p class="site-subtitle">パスワードを入力して利用を開始してください。</p>
      <div class="form-group">
        <label for="password-input">パスワード</label>
        <input id="password-input" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary">ログイン</button>
      <p id="auth-error" class="error-msg auth-error" hidden>パスワードが正しくありません。</p>
    </form>
  </main>

  <div id="app-shell" hidden>
    <header class="site-header">
      <div class="header-inner">
        <div class="header-title-group">
          <h1 class="site-title">⚡ TTT Calculator</h1>
          <p class="site-subtitle">Zwift Team Time Trial Simulator</p>
        </div>
        <button id="logout-button" class="btn btn-secondary btn-sm header-logout-btn" type="button">ログアウト</button>
      </div>
    </header>

    <nav class="tab-nav" role="navigation" aria-label="メインナビゲーション">
      <a class="tab-link" href="#/main"    data-page="main">メイン</a>
      <a class="tab-link" href="#/courses" data-page="courses">コース</a>
      <a class="tab-link" href="#/gear"    data-page="gear">機材</a>
      <a class="tab-link" href="#/teams"   data-page="teams">チーム</a>
      <a class="tab-link" href="#/lineups" data-page="lineups">ラインナップ</a>
      <a class="tab-link" href="#/simulate" data-page="simulate">シミュレーション</a>
    </nav>

    <main id="content" class="content" role="main">
      <div class="loading">読み込み中...</div>
    </main>

    <footer class="site-footer">
      <p>Zwift TTT Calculator — 個人利用向け非公式ツール</p>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
